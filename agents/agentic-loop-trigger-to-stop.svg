<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img">
<title>A designed agent loop: trigger, reason, act, observe, stop condition</title>
<desc>A trigger starts the loop. The agent reasons, acts through a gated call, and observes the result. A stop condition checks the done criteria and hard caps. If not met, the agent reasons again; if met, it reports to the person. The person designs the trigger, goal, done check, caps and tools.</desc>
<style>
text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="350" fill="#FFFFFF"/>

<g class="c-purple">
  <rect x="50" y="60" width="116" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="108" y="78" text-anchor="middle" dominant-baseline="central">Trigger</text>
  <text class="ts" x="108" y="98" text-anchor="middle" dominant-baseline="central">Time or event</text>
</g>
<g class="c-teal">
  <rect x="204" y="60" width="116" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="262" y="78" text-anchor="middle" dominant-baseline="central">Reason</text>
  <text class="ts" x="262" y="98" text-anchor="middle" dominant-baseline="central">Next step</text>
</g>
<g class="c-teal">
  <rect x="358" y="60" width="116" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="416" y="78" text-anchor="middle" dominant-baseline="central">Act</text>
  <text class="ts" x="416" y="98" text-anchor="middle" dominant-baseline="central">Gated call</text>
</g>
<g class="c-teal">
  <rect x="512" y="60" width="116" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="570" y="78" text-anchor="middle" dominant-baseline="central">Observe</text>
  <text class="ts" x="570" y="98" text-anchor="middle" dominant-baseline="central">See result</text>
</g>

<line x1="168" y1="88" x2="202" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="322" y1="88" x2="356" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="476" y1="88" x2="510" y2="88" class="arr" marker-end="url(#arrow)"/>

<line x1="570" y1="118" x2="570" y2="148" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
  <rect x="428" y="150" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="528" y="168" text-anchor="middle" dominant-baseline="central">Stop condition met?</text>
  <text class="ts" x="528" y="188" text-anchor="middle" dominant-baseline="central">Done criteria or hard cap</text>
</g>

<path d="M426 178 L262 178 L262 120" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="344" y="168" text-anchor="middle">No: reason again</text>

<line x1="528" y1="208" x2="528" y2="248" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="540" y="232">Yes</text>

<g class="c-purple">
  <rect x="50" y="250" width="350" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="225" y="268" text-anchor="middle" dominant-baseline="central">You design the loop, then step back</text>
  <text class="ts" x="225" y="288" text-anchor="middle" dominant-baseline="central">Trigger, goal, done check, caps, tools</text>
</g>
<g class="c-purple">
  <rect x="428" y="250" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="528" y="268" text-anchor="middle" dominant-baseline="central">Report to you</text>
  <text class="ts" x="528" y="288" text-anchor="middle" dominant-baseline="central">Result, not-checked list</text>
</g>

<rect class="c-purple" x="50" y="329" width="10" height="10" rx="2" stroke-width="0.5"/>
<text class="ts" x="66" y="334" dominant-baseline="central">You</text>
<rect class="c-teal" x="120" y="329" width="10" height="10" rx="2" stroke-width="0.5"/>
<text class="ts" x="136" y="334" dominant-baseline="central">The loop's work</text>
<rect class="c-coral" x="250" y="329" width="10" height="10" rx="2" stroke-width="0.5"/>
<text class="ts" x="266" y="334" dominant-baseline="central">Stop check</text>
</svg>
