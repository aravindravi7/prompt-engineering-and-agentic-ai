<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
<title>The agentic loop with the person in it</title>
<desc>Three phases, gather context, take action and verify, joined by gates. The person supplies context, limits and a done condition, can interrupt at any point, and reviews the result. An effort setting applies at every step. A failed check loops back to gathering.</desc>
<style>
text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>

<g class="c-gray">
  <rect x="40" y="30" width="600" height="30" rx="4" stroke-width="0.5"/>
  <text class="th" x="340" y="45" text-anchor="middle" dominant-baseline="central">Effort: how deeply it reasons at every step</text>
</g>

<g class="c-purple">
  <rect x="40" y="80" width="190" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="135" y="98" text-anchor="middle" dominant-baseline="central">Context you give</text>
  <text class="ts" x="135" y="118" text-anchor="middle" dominant-baseline="central">Goal, files, constraints</text>
</g>
<g class="c-purple">
  <rect x="245" y="80" width="190" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="98" text-anchor="middle" dominant-baseline="central">Limits you set</text>
  <text class="ts" x="340" y="118" text-anchor="middle" dominant-baseline="central">Scope and permissions</text>
</g>
<g class="c-purple">
  <rect x="450" y="80" width="190" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="545" y="98" text-anchor="middle" dominant-baseline="central">Done-when you set</text>
  <text class="ts" x="545" y="118" text-anchor="middle" dominant-baseline="central">Tests, checks, evidence</text>
</g>

<line x1="120" y1="138" x2="120" y2="176" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="138" x2="340" y2="176" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="138" x2="560" y2="176" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="40" y="180" width="160" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="120" y="198" text-anchor="middle" dominant-baseline="central">Gather context</text>
  <text class="ts" x="120" y="218" text-anchor="middle" dominant-baseline="central">Read, then plan</text>
</g>
<g class="c-teal">
  <rect x="260" y="180" width="160" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="198" text-anchor="middle" dominant-baseline="central">Take action</text>
  <text class="ts" x="340" y="218" text-anchor="middle" dominant-baseline="central">Every action gated</text>
</g>
<g class="c-teal">
  <rect x="480" y="180" width="160" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="198" text-anchor="middle" dominant-baseline="central">Verify results</text>
  <text class="ts" x="560" y="218" text-anchor="middle" dominant-baseline="central">Check against done</text>
</g>

<line x1="202" y1="208" x2="214" y2="208" class="arr" marker-end="url(#arrow)"/>
<line x1="246" y1="208" x2="258" y2="208" class="arr" marker-end="url(#arrow)"/>
<line x1="422" y1="208" x2="478" y2="208" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
  <rect x="220" y="198" width="20" height="20" rx="3" stroke-width="0.5" transform="rotate(45 230 208)"/>
</g>
<text class="ts" x="230" y="254" text-anchor="middle">Plan approved?</text>

<line x1="560" y1="238" x2="560" y2="272" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
  <rect x="550" y="280" width="20" height="20" rx="3" stroke-width="0.5" transform="rotate(45 560 290)"/>
</g>
<text class="ts" x="582" y="294">Done?</text>

<path d="M544 290 L120 290 L120 240" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="332" y="280" text-anchor="middle">No: back to gathering, with what failed</text>

<line x1="560" y1="308" x2="560" y2="332" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="572" y="324">Yes</text>

<g class="c-purple">
  <rect x="40" y="336" width="300" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="190" y="354" text-anchor="middle" dominant-baseline="central">You can interrupt at any point</text>
  <text class="ts" x="190" y="374" text-anchor="middle" dominant-baseline="central">Steer, add context, redirect</text>
</g>
<g class="c-purple">
  <rect x="450" y="336" width="190" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="545" y="354" text-anchor="middle" dominant-baseline="central">You review the result</text>
  <text class="ts" x="545" y="374" text-anchor="middle" dominant-baseline="central">Diff, not-checked list</text>
</g>

<rect class="c-purple" x="40" y="412" width="10" height="10" rx="2" stroke-width="0.5"/>
<text class="ts" x="56" y="417" dominant-baseline="central">You</text>
<rect class="c-teal" x="110" y="412" width="10" height="10" rx="2" stroke-width="0.5"/>
<text class="ts" x="126" y="417" dominant-baseline="central">The loop's work</text>
<rect class="c-coral" x="240" y="412" width="10" height="10" rx="2" stroke-width="0.5"/>
<text class="ts" x="256" y="417" dominant-baseline="central">Gate</text>
<rect class="c-gray" x="310" y="412" width="10" height="10" rx="2" stroke-width="0.5"/>
<text class="ts" x="326" y="417" dominant-baseline="central">Setting</text>
</svg>
